[wordpress_site]
user = wp_user
group = wp_group

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.process_idle_timeout = 10s

php_admin_value[disable_functions] = exec,passthru,shell_exec,system

catch_workers_output = yes

env[TMP] = /tmp
env[HOSTNAME] = $HOSTNAME
